<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Petch Cover</title>
<style>
  @font-face { font-family:'DIN Next Rounded'; src:url('fonts/din-next-rounded-lt-pro-light.otf')   format('opentype'); font-weight:300; }
  @font-face { font-family:'DIN Next Rounded'; src:url('fonts/din-next-rounded-lt-pro-regular.otf') format('opentype'); font-weight:400; }
  @font-face { font-family:'DIN Next Rounded'; src:url('fonts/din-next-rounded-lt-pro-medium.otf')  format('opentype'); font-weight:500; }
  @font-face { font-family:'DIN Next Rounded'; src:url('fonts/din-next-rounded-lt-pro-bold.otf')    format('opentype'); font-weight:600 900; }

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#000; overflow:hidden; }
  body { font-family:'DIN Next Rounded', sans-serif; -webkit-font-smoothing:antialiased; }

  /* Flat, exactly as the source film: no gradients, no gloss, no depth. */
  #stage { position:relative; overflow:hidden; background:#33CCFF; }
  #track { position:absolute; top:0; left:0; height:100%; will-change:transform; }

  .station {
    position:absolute; top:0; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .item { will-change:transform, opacity; }

  .eyebrow {
    color:rgba(255,255,255,0.92); font-weight:500; text-transform:uppercase;
    letter-spacing:0.24em; white-space:nowrap;
  }
  .headline { color:#fff; font-weight:900; line-height:0.98; white-space:nowrap; letter-spacing:-0.005em; }
  .wordmark { color:#fff; font-weight:900; line-height:1; letter-spacing:0.005em; }
  .lockupSub { color:#fff; font-weight:700; text-transform:uppercase; letter-spacing:0.2em; white-space:nowrap; }

  .composer {
    background:#00BAFF; display:flex; flex-direction:column; justify-content:space-between;
    box-shadow:0 10px 30px rgba(0,110,170,0.20);
  }
  .composer .typed { color:#fff; font-weight:400; white-space:pre; }
  .composer .caret { color:#fff; font-weight:300; }
  .composer .row { display:flex; align-items:center; justify-content:space-between; }
  .composer .row .right { display:flex; align-items:center; }
  .sendBtn { background:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; }

  .card { background:#00BAFF; display:flex; align-items:center; box-shadow:0 10px 30px rgba(0,110,170,0.20); }
  .card .tile { flex:none; display:flex; align-items:center; justify-content:center; }
  .card .txt { display:flex; flex-direction:column; }
  .card .t { color:#fff; font-weight:800; }
  .card .s { color:rgba(255,255,255,0.95); font-weight:400; }
  .card .m { color:#fff; font-weight:700; display:flex; align-items:center; }
  .dots { display:inline-flex; }
  .dots i { background:rgba(255,255,255,0.85); border-radius:50%; display:block; }

  .row2 { background:#00487F; display:flex; align-items:center; justify-content:space-between; }
  .row2 .lbl { color:#fff; font-weight:700; }
  .badge {
    color:#fff; font-weight:800; text-transform:uppercase;
    display:flex; align-items:center; justify-content:center; letter-spacing:0.04em;
  }

  .pet { position:relative; }
  .pet img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; visibility:hidden; }
  .pet img.on { visibility:visible; }
</style>
</head>
<body>
<div id="stage"><div id="track"></div></div>

<script>
// ─────────────────────────────────────────────────────────────
//  Petch — 8s portfolio cover.
//
//  One continuous camera move along a horizontal track of four
//  stations, in the flat kinetic-type language of the source film.
//  There are no cuts: the camera never stops, it only eases.
//
//  Loop closure: the camera travels exactly one track period, and
//  EVERY element's state is a pure function of the camera's track
//  position — not of wall-clock time. When the camera wraps, each
//  slot inherits its neighbour's exact state, so the frame after the
//  last is identical to the first.
// ─────────────────────────────────────────────────────────────
const P   = new URLSearchParams(location.search)
const W   = +(P.get('w') || 1920)
const H   = +(P.get('h') || 1080)
const DUR = 8
const TAU = Math.PI * 2

// palette, sampled from the source film
const CYAN = [0x33, 0xCC, 0xFF]
const NAVY = [0x08, 0x23, 0x3F]

const PET_FRAMES = 75
const PET_LOOPS  = 3

const AR  = W / H
const FMT = AR > 1.30 ? 'wide' : (AR > 0.80 ? 'square' : 'tall')
// Content is ~1120px wide on the 1920 reference, so on the narrower
// formats the scale is set by width, not by the 1920x1080 diagonal —
// otherwise everything shrinks into the middle of the frame.
const S   = FMT === 'wide' ? Math.min(W / 1920, H / 1080)
          : FMT === 'square' ? W / 1300
          : W / 1285
const px  = n => Math.round(n * S) + 'px'

const SPAN   = W                      // one station per viewport width
const NSTAT  = 4
const TRACK  = SPAN * NSTAT
const EASE_K = 0.82                   // camera slows to 18% at each station, never stops

const stage = document.getElementById('stage')
const track = document.getElementById('track')
stage.style.width  = W + 'px'
stage.style.height = H + 'px'

const ICONS = {
  person: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10" cy="8" r="3.3"/><path d="M4.2 19.2c0-3.2 2.6-5.4 5.8-5.4s5.8 2.2 5.8 5.4"/>
    <path d="M18.4 4.2l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z" fill="#fff" stroke="none"/></svg>`,
  nodes: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 5.4L5.6 16.8h12.8z"/><circle cx="12" cy="5.4" r="1.7" fill="#fff"/>
    <circle cx="5.6" cy="16.8" r="1.7" fill="#fff"/><circle cx="18.4" cy="16.8" r="1.7" fill="#fff"/></svg>`,
  heart: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 20s-7.2-4.6-7.2-9.4A4.3 4.3 0 0 1 12 8.1a4.3 4.3 0 0 1 7.2 2.5C19.2 15.4 12 20 12 20z"/></svg>`,
}

const CARDS = [
  { tile: '#E8788E', icon: 'person', t: 'Personalisation',   s: 'Tailoring insights from your daily patterns', m: 'Learning you' },
  { tile: '#3EA28A', icon: 'nodes',  t: 'Anticipatory care', s: 'Surfacing needs before you think to ask',     m: 'Anticipating' },
  { tile: '#2E6AD5', icon: 'heart',  t: 'Empathy',           s: 'Speaking with you, never instructing',        m: 'Listening' },
]

const ROWS = [
  { l: '&lt; 6 hours of sleep',   b: 'Urgent',   c: '#FD5656' },
  { l: 'Drinking sugary drinks',  b: 'Aware',    c: '#FDC557' },
  { l: 'Going to the Gym',        b: 'Maintain', c: '#83F22D' },
]

const TYPED_TEXT = "Let's learn about my sleep!"

const dots = () => `<span class="dots" style="gap:${px(5)};margin-left:${px(10)}">` +
  `<i style="width:${px(6)};height:${px(6)}"></i>`.repeat(3) + `</span>`

function buildLockup(el) {
  el.innerHTML = `
    <div class="item" data-k="0">
      <div class="pet" style="width:${px(238)};height:${px(300)};margin:0 auto ${px(30)}"></div>
    </div>
    <div class="item" data-k="1" style="text-align:center">
      <div class="wordmark" style="font-size:${px(132)}">PETCH</div>
      <div class="lockupSub" style="font-size:${px(30)};margin-top:${px(18)}">Your AI healthcare chatbot</div>
    </div>`
}

const head = (word, sub) => `
  <div class="item" data-k="0" style="text-align:center">
    <div class="eyebrow" style="font-size:${px(30)}">Petch helps you</div>
    <div class="headline" style="font-size:${px(152)};margin-top:${px(12)}">${word}</div>
    <div class="eyebrow" style="font-size:${px(25)};opacity:.82;margin-top:${px(16)}">${sub}</div>
  </div>`

function buildKnow(el) {
  el.innerHTML = head('KNOW', 'one check-in, every day') + `
    <div class="item" data-k="1" style="margin-top:${px(58)}">
      <div class="composer" style="width:${px(1080)};height:${px(216)};border-radius:${px(40)};padding:${px(34)} ${px(38)}">
        <div style="font-size:${px(40)}"><span class="typed"></span><span class="caret">|</span></div>
        <div class="row">
          <svg width="${px(34)}" height="${px(34)}" viewBox="0 0 24 24" fill="#fff"><path d="M19 13H13v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          <div class="right" style="gap:${px(22)}">
            <svg width="${px(32)}" height="${px(32)}" viewBox="0 0 24 24" fill="#fff"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
            <span class="sendBtn" style="width:${px(50)};height:${px(50)}">
              <svg width="${px(28)}" height="${px(28)}" viewBox="0 0 24 24" fill="#00BAFF"><path d="M12 4.6l6.2 6.2-1.5 1.5-3.7-3.7V19.4h-2.0V8.6l-3.7 3.7-1.5-1.5z"/></svg>
            </span>
          </div>
        </div>
      </div>
    </div>`
}

function buildLearn(el) {
  el.innerHTML = head('LEARN', 'personalised, never generic') +
    `<div style="margin-top:${px(52)}">` + CARDS.map((c, i) => `
      <div class="item" data-k="${i + 1}" style="margin-top:${i ? px(26) : 0}">
        <div class="card" style="width:${px(1120)};height:${px(150)};border-radius:${px(26)};padding:0 ${px(30)};gap:${px(28)}">
          <span class="tile" style="width:${px(94)};height:${px(94)};border-radius:${px(24)};background:${c.tile}">
            <span style="width:${px(50)};height:${px(50)};display:block">${ICONS[c.icon]}</span>
          </span>
          <span class="txt" style="gap:${px(5)}">
            <span class="t" style="font-size:${px(38)}">${c.t}</span>
            <span class="s" style="font-size:${px(27)}">${c.s}</span>
            <span class="m" style="font-size:${px(20)};margin-top:${px(3)}">${c.m}${dots()}</span>
          </span>
        </div>
      </div>`).join('') + `</div>`
}

function buildAct(el) {
  el.innerHTML = head('TAKE ACTION', "what I'm noticing this week") +
    `<div style="margin-top:${px(52)}">` + ROWS.map((r, i) => `
      <div class="item" data-k="${i + 1}" style="margin-top:${i ? px(24) : 0}">
        <div class="row2" style="width:${px(1120)};height:${px(120)};border-radius:${px(22)};padding:0 ${px(30)}">
          <span class="lbl" style="font-size:${px(34)}">${r.l}</span>
          <span class="badge" style="background:${r.c};font-size:${px(22)};height:${px(52)};padding:0 ${px(22)};border-radius:${px(13)}">${r.b}</span>
        </div>
      </div>`).join('') + `</div>`
}

const BUILDERS = [buildLockup, buildKnow, buildLearn, buildAct]

// Slots -1 … NSTAT+1 so both viewport edges are always covered.
const slots = []
for (let i = -1; i <= NSTAT + 1; i++) {
  const el = document.createElement('div')
  el.className = 'station'
  el.style.left  = (i * SPAN) + 'px'
  el.style.width = SPAN + 'px'
  BUILDERS[((i % NSTAT) + NSTAT) % NSTAT](el)
  track.appendChild(el)
  slots.push({ i, el, items: [...el.querySelectorAll('.item')] })
}
const slotOf = new Map(slots.map(s => [s.el, s.i]))

// every lockup slot gets its own copy of the mascot frames
const petSets = [...track.querySelectorAll('.pet')].map(host => {
  const imgs = []
  for (let n = 1; n <= PET_FRAMES; n++) {
    const img = document.createElement('img')
    img.src = 'pet/f' + String(n).padStart(3, '0') + '.png'
    host.appendChild(img)
    imgs.push(img)
  }
  return imgs
})
let petOn = -1

const typers = [...track.querySelectorAll('.composer')].map(c => ({
  i: slotOf.get(c.closest('.station')),
  typed: c.querySelector('.typed'),
  caret: c.querySelector('.caret'),
}))

const clamp  = (v, a, b) => v < a ? a : (v > b ? b : v)
const smooth = t => t * t * (3 - 2 * t)
const mix    = (a, b, t) => Math.round(a + (b - a) * t)

function setT(t) {
  const u = (t / DUR) % 1

  // Camera: the cosine term averages to zero over the clip, so this
  // integrates to exactly one TRACK — x(0)=0, x(1)=TRACK. With
  // EASE_K < 1 the velocity dips at each station but never reaches 0.
  const camX = TRACK * (u - (EASE_K / (TAU * NSTAT)) * Math.sin(TAU * NSTAT * u))
  track.style.transform = 'translate3d(' + (-camX).toFixed(3) + 'px,0,0)'

  // cyan → navy → cyan, centred on the last station and back to zero
  // at both ends of the track, so the wrap needs no colour jump.
  // Plateau, not a linear ramp: fully navy while the station is on
  // screen, and the whole colour change spends its time in the gap
  // where almost nothing is visible — so no muddy half-blend reads.
  // Still exactly 0 at d = 1, which is what keeps the wrap clean.
  const d    = Math.abs((camX - 3 * SPAN) / SPAN)
  const navy = smooth(clamp((0.85 - d) / 0.40, 0, 1))
  stage.style.background =
    `rgb(${mix(CYAN[0], NAVY[0], navy)},${mix(CYAN[1], NAVY[1], navy)},${mix(CYAN[2], NAVY[2], navy)})`

  // per-item entrance / exit, a function of camera position only
  for (const s of slots) {
    const base = (camX - s.i * SPAN) / SPAN
    for (const item of s.items) {
      const p = base + (+item.dataset.k) * 0.052
      const e = smooth(clamp((p + 0.86) / 0.54, 0, 1))
      const l = smooth(clamp((0.86 - p) / 0.54, 0, 1))
      const y = (1 - e) * 52 * S - (1 - l) * 52 * S
      item.style.opacity   = (e * l).toFixed(4)
      item.style.transform =
        `translate3d(0,${y.toFixed(2)}px,0) scale(${(0.962 + 0.038 * Math.min(e, l)).toFixed(4)})`
    }
  }

  // typewriter — also position-driven, so it replays identically on
  // every pass and is mid-stroke at exactly the same point each loop
  for (const tp of typers) {
    const p    = (camX - tp.i * SPAN) / SPAN
    const prog = clamp((p + 0.66) / 0.44, 0, 1)
    tp.typed.textContent  = TYPED_TEXT.slice(0, Math.round(TYPED_TEXT.length * prog))
    tp.caret.style.opacity = prog >= 1 ? (Math.floor(p * 9) % 2 ? 0 : 1) : 1
  }

  // mascot: a whole number of idle cycles per clip
  const f = Math.floor(u * PET_LOOPS * PET_FRAMES) % PET_FRAMES
  if (f !== petOn) {
    for (const set of petSets) {
      if (petOn >= 0) set[petOn].classList.remove('on')
      set[f].classList.add('on')
    }
    petOn = f
  }
}

window.setT = setT
window.ready = (async () => {
  await document.fonts.ready
  const imgs = [...track.querySelectorAll('img')]
  await Promise.all(imgs.map(i => (i.decode ? i.decode().catch(() => {}) : Promise.resolve())))
  setT(0)
  return true
})()
</script>
</body>
</html>
